[package]
name = "rd-core"
description = "Wire protocol, TLS helpers, framing and tile codec shared by host, agent and client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:sha2"]
p2p = ["tls", "dep:quinn", "dep:log", "dep:socket2"]
h264 = ["dep:openh264", "dep:openh264-sys2", "dep:windows", "dep:log"]
clipboard = ["dep:arboard", "dep:png", "dep:log", "dep:clipboard-win"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
postcard = { version = "1", features = ["alloc"] }
lz4_flex = "0.11"
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
socket2 = { version = "0.6", optional = true }
openh264 = { version = "0.9", optional = true }
openh264-sys2 = { version = "0.9", optional = true }
arboard = { version = "3", optional = true }
png = { version = "0.18", optional = true }
log = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", optional = true, default-features = false, features = ["crypto", "ring", "pem"] }


[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", optional = true }
# Hardware H.264 encoding through Media Foundation (part of the `h264` feature).
windows = { version = "0.58", optional = true, features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }
