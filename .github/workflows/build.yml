# Builds and tests on Windows and Linux for every push and pull request.
# Pushing a tag like v0.2.0 also publishes a GitHub release with ready-to-run downloads
# (the app's "new version available" note points there).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    # Code signing (Azure Trusted Signing) happens only when these secrets are set;
    # see packaging/windows/sign.ps1. Without them the programs are built unsigned.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      # NASM lets OpenH264 build its SIMD code; without it the H.264 encoder and
      # decoder silently fall back to plain C and run several times slower.
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Sign the programs
        if: ${{ env.AZURE_CLIENT_ID != '' && github.event_name != 'pull_request' }}
        shell: pwsh
        run: packaging/windows/sign.ps1 target/release/rd-client.exe target/release/rd-host.exe target/release/rd-relay.exe
      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/rd-remote-desktop-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/rd-client.exe, target/release/rd-host.exe, target/release/rd-relay.exe, README.md $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/rd-remote-desktop-windows-x64.zip" -Force
          # The one-file installer (rd-client is a windowed program: wait for it).
          $setup = "dist/RD-Remote-Desktop-Setup-windows-x64.exe"
          Start-Process -Wait -NoNewWindow -FilePath target/release/rd-client.exe -ArgumentList "make-installer", "--host", "target/release/rd-host.exe", $setup
          if (-not (Test-Path $setup)) { throw "installer not made" }
          # The installer is signed too (it finds its contents before the signature).
          if ($env:AZURE_CLIENT_ID -and $env:GITHUB_EVENT_NAME -ne 'pull_request') { packaging/windows/sign.ps1 $setup }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/rd-remote-desktop-windows-x64.zip
            dist/RD-Remote-Desktop-Setup-windows-x64.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libasound2-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Check that H.264 has its fast code
        # OpenH264 quietly drops its assembly when NASM fails; fail the build instead.
        run: grep -q 'WelsDctT4_sse2' target/release/rd-host || { echo "OpenH264 was built without its SIMD code (is nasm installed?)"; exit 1; }
      - name: Package
        run: |
          dir=dist/rd-remote-desktop-linux-x86_64
          mkdir -p "$dir"
          cp target/release/rd-client target/release/rd-host target/release/rd-relay README.md "$dir/"
          tar -C dist -czf dist/rd-remote-desktop-linux-x86_64.tar.gz rd-remote-desktop-linux-x86_64
          # The one-file installer, in a .tar.gz so it stays executable (double-click after extracting).
          mkdir -p dist/setup
          target/release/rd-client make-installer --host target/release/rd-host dist/setup/RD-Remote-Desktop-Setup
          tar -C dist/setup -czf dist/RD-Remote-Desktop-Setup-linux-x86_64.tar.gz RD-Remote-Desktop-Setup
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/rd-remote-desktop-linux-x86_64.tar.gz
            dist/RD-Remote-Desktop-Setup-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Windows: run RD-Remote-Desktop-Setup-windows-x64.exe. Linux: extract RD-Remote-Desktop-Setup-linux-x86_64.tar.gz and double-click RD-Remote-Desktop-Setup. Then open RD Remote Desktop from the Start menu / application menu and choose Set up remote access. (The .zip / .tar.gz with the plain programs are for the app's Update button and for scripting.)"
